<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Speaker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Text Speaker</h1>
      <p>Enter some text and let your browser read it aloud.</p>
    </header>

    <main>
      <label for="text">Enter your text</label>
      <textarea
        id="text"
        maxlength="5000"
        placeholder="Write something here..."
      >Hello! Welcome to my text-to-speech app.</textarea>

      <div class="text-info">
        <span id="counter">0 / 5000</span>
        <button id="clearButton" class="link-button">Clear</button>
      </div>

      <div class="settings">
        <div class="input-group">
          <label for="language">Language</label>
          <select id="language"></select>
        </div>

        <div class="input-group">
          <label for="voice">Voice</label>
          <select id="voice"></select>
        </div>

        <div class="input-group">
          <label for="speed">
            Speed: <span id="speedValue">1.0×</span>
          </label>
          <input id="speed" type="range" min="0.5" max="2" value="1" step="0.1">
        </div>

        <div class="input-group">
          <label for="pitch">
            Pitch: <span id="pitchValue">1.0</span>
          </label>
          <input id="pitch" type="range" min="0.5" max="2" value="1" step="0.1">
        </div>
      </div>

      <p id="status">Ready</p>

      <div class="buttons">
        <button id="speakButton" class="speak-button">Speak</button>
        <button id="pauseButton">Pause</button>
        <button id="resumeButton">Resume</button>
        <button id="stopButton">Stop</button>
      </div>
    </main>

    <footer>
      <p>
        The language list is complete, but speech is available only when your
        browser or device has a voice installed for the selected language.
      </p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
